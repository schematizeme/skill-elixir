# schematize-elixir — pre-commit (pip install pre-commit && pre-commit install).
# Copie para .pre-commit-config.yaml na raiz do repo.
repos:
  - repo: local
    hooks:
      - id: archive-secret-scan
        name: scan de segredo/PII no archive (§16.1/§32)
        entry: bash .claude/skills/schematize-elixir/scripts/archive-secret-scan.sh .
        language: system
        pass_filenames: false
      - id: standards-gate
        name: gate de padrões no diff (§35/§37)
        entry: bash .claude/skills/schematize-elixir/scripts/check-diff.sh HEAD
        language: system
        pass_filenames: false
      - id: mix-format
        name: mix format --check-formatted (§35)
        entry: mix format --check-formatted
        language: system
        pass_filenames: false
        files: \.exs?$
      - id: credo
        name: mix credo --strict (linter — §37)
        entry: mix credo --strict
        language: system
        pass_filenames: false
        files: \.exs?$
